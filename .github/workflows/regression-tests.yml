name: Android regressions

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK used by the standalone tests
        run: sdkmanager 'platforms;android-28' 'build-tools;30.0.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
      - name: Run regression tests against real library sources
        run: gradle --no-daemon -p regression-tests testDebugUnitTest --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-results
          path: |
            regression-tests/build/reports/tests/
            regression-tests/build/test-results/
